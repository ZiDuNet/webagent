log_format webagent '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time ua=$upstream_addr rid=$request_id';
access_log /dev/stdout webagent;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 19m;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 302 /admin/; }
    location = /health { access_log off; return 200 'ok'; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control no-cache;
    }
    location /api/control/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    location / { return 404; }
}
