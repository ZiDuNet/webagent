# Copy into the business system's Nginx and adjust upstream/TLS.
# Use this for mode A (Chat embedded) and mode B (Chat + Admin embedded).
upstream webagent_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 19m;

    # Optional: serve chat/dist here if the business app does not already.
    # location /agent/ { alias /srv/webagent/chat/; try_files $uri $uri/ /agent/index.html; }

    location /api/agent/ {
        proxy_pass http://webagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3700s;
        proxy_send_timeout 130s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location /api/integrations/pc4d/ {
        proxy_pass http://webagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/control/ {
        proxy_pass http://webagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }

    location = /api/me {
        proxy_pass http://webagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
