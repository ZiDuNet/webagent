name: webagent-pi

services:
  app:
    image: webagent-pi:local
    build:
      context: .
      target: app
      args:
        VITE_CHAT_URL: ${WEBAGENT_CHAT_URL:-/chat/}
        VITE_ADMIN_URL: ${WEBAGENT_ADMIN_URL:-/admin/}
        VITE_BUSINESS_URL: ${WEBAGENT_BUSINESS_URL:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,mode=1777
    environment:
      WEBAGENT_BIND_HOST: 0.0.0.0
      WEBAGENT_PORT: 8000
      WEBAGENT_DATA_DIR: /app/data
      WEBAGENT_SECRET_KEY: ${WEBAGENT_SECRET_KEY:?请先运行 npm run init:env}
      WEBAGENT_CONTROL_PASSWORD: ${WEBAGENT_CONTROL_PASSWORD:?请设置独立的管理密码}
      WEBAGENT_RESET_CONTROL_PASSWORD: ${WEBAGENT_RESET_CONTROL_PASSWORD:-0}
      WEBAGENT_COOKIE_SECURE: ${WEBAGENT_COOKIE_SECURE:-0}
      WEBAGENT_ALLOW_STDIO: ${WEBAGENT_ALLOW_STDIO:-0}
      WEBAGENT_LOCAL_TOOLS: ${WEBAGENT_LOCAL_TOOLS:-off}
      WEBAGENT_SERVE_ADMIN: ${WEBAGENT_SERVE_ADMIN:-1}
      WEBAGENT_SERVE_CHAT: ${WEBAGENT_SERVE_CHAT:-1}
      WEBAGENT_UI_ORIGINS: ${WEBAGENT_UI_ORIGINS:-}
      WEBAGENT_PC4D_ENABLED: ${WEBAGENT_PC4D_ENABLED:-0}
      WEBAGENT_PC4D_BASE_URL: ${WEBAGENT_PC4D_BASE_URL:-https://cloud.4dbim.vip}
      WEBAGENT_PC4D_PUBLIC_URL: ${WEBAGENT_PC4D_PUBLIC_URL:-}
      WEBAGENT_PC4D_TOKEN_HOURS: ${WEBAGENT_PC4D_TOKEN_HOURS:-2}
      WEBAGENT_PC4D_PERMISSION_CACHE_SECONDS: ${WEBAGENT_PC4D_PERMISSION_CACHE_SECONDS:-10}
    ports:
      - "${WEBAGENT_BIND_HOST:-0.0.0.0}:${WEBAGENT_PORT:-8000}:8000"
    volumes:
      - pi-data:/app/data
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pi-data:
