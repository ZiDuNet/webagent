name: webagent-pi

services:
  backend:
    image: webagent-pi-backend:local
    build:
      context: .
      target: backend
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,mode=1777
    environment:
      WEBAGENT_BIND_HOST: 0.0.0.0
      WEBAGENT_PORT: 8000
      WEBAGENT_DATA_DIR: /app/data
      WEBAGENT_SECRET_KEY: ${WEBAGENT_SECRET_KEY:?请先运行 npm run init:env}
      WEBAGENT_CONTROL_PASSWORD: ${WEBAGENT_CONTROL_PASSWORD:?请设置独立的管理密码}
      WEBAGENT_RESET_CONTROL_PASSWORD: ${WEBAGENT_RESET_CONTROL_PASSWORD:-0}
      WEBAGENT_COOKIE_SECURE: ${WEBAGENT_COOKIE_SECURE:-0}
      WEBAGENT_ALLOW_STDIO: ${WEBAGENT_ALLOW_STDIO:-0}
      WEBAGENT_LOCAL_TOOLS: ${WEBAGENT_LOCAL_TOOLS:-off}
      WEBAGENT_SERVE_ADMIN: ${WEBAGENT_SERVE_ADMIN:-1}
      WEBAGENT_SERVE_CHAT: ${WEBAGENT_SERVE_CHAT:-1}
      WEBAGENT_UI_ORIGINS: ${WEBAGENT_UI_ORIGINS:-}
      WEBAGENT_PC4D_ENABLED: ${WEBAGENT_PC4D_ENABLED:-0}
      WEBAGENT_PC4D_BASE_URL: ${WEBAGENT_PC4D_BASE_URL:-https://cloud.4dbim.vip}
      WEBAGENT_PC4D_PUBLIC_URL: ${WEBAGENT_PC4D_PUBLIC_URL:-}
      WEBAGENT_PC4D_TOKEN_HOURS: ${WEBAGENT_PC4D_TOKEN_HOURS:-2}
      WEBAGENT_PC4D_PERMISSION_CACHE_SECONDS: ${WEBAGENT_PC4D_PERMISSION_CACHE_SECONDS:-10}
    expose: [8000]
    volumes:
      - pi-data:/app/data
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin:
    image: webagent-pi-admin:local
    build:
      context: .
      target: admin
      args:
        VITE_CHAT_URL: ${WEBAGENT_CHAT_URL:-http://localhost:${WEBAGENT_CHAT_PORT:-8080}/chat/}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864,mode=1777
    ports:
      - "${WEBAGENT_BIND_HOST:-127.0.0.1}:${WEBAGENT_ADMIN_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  chat:
    image: webagent-pi-chat:local
    build:
      context: .
      target: chat
      args:
        VITE_ADMIN_URL: ${WEBAGENT_ADMIN_URL:-http://localhost:${WEBAGENT_ADMIN_PORT:-8081}/admin/}
        VITE_BUSINESS_URL: ${WEBAGENT_BUSINESS_URL:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864,mode=1777
    ports:
      - "${WEBAGENT_BIND_HOST:-127.0.0.1}:${WEBAGENT_CHAT_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pi-data:
